[package]
name = "smt-fuzz"
version = "1.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
smt-solver = { path = "../crates/smt-solver" }
smt-core = { path = "../crates/smt-core" }
smt-parser = { path = "../crates/smt-parser" }
smt-sat = { path = "../crates/smt-sat" }
smt-mba = { path = "../crates/smt-mba" }

[[bin]]
name = "fuzz_x86_decoder"
path = "fuzz_targets/fuzz_x86_decoder.rs"
test = false
doc = false

[[bin]]
name = "fuzz_smt_parser"
path = "fuzz_targets/fuzz_smt_parser.rs"
test = false
doc = false

[[bin]]
name = "fuzz_qf_bv_diff"
path = "fuzz_targets/fuzz_qf_bv_diff.rs"
test = false
doc = false
