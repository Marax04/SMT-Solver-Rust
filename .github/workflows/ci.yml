name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  CARGO_TERM_COLOR: always
  # Required: ensures differential tests panic rather than silently falling back
  # to self-consistency mode when z3/cvc5 are unavailable.
  STRICT_DIFFERENTIAL: "1"

jobs:
  build-and-test:
    name: Build & Test (release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install z3 (required for STRICT_DIFFERENTIAL mode)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y z3
          z3 --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --release --workspace -- -D warnings

      - name: Run all workspace tests (release, strict differential)
        run: cargo test --release --workspace -- --nocapture
        env:
          STRICT_DIFFERENTIAL: "1"
          RUST_BACKTRACE: "1"

      - name: Verify zero #[allow(...)] attributes
        run: |
          count=$(grep -r '#\[allow' crates/ --include='*.rs' | wc -l)
          echo "allow() count: $count"
          if [ "$count" -gt 0 ]; then
            echo "ERROR: Found #[allow(...)] attributes. All warnings must be fixed, not suppressed."
            grep -r '#\[allow' crates/ --include='*.rs'
            exit 1
          fi
